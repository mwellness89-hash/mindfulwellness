<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Coach</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #coaching-tip { 
      margin-top: 20px; 
      font-size: 1.2em; 
      padding: 20px; 
      border-left: 4px solid #4CAF50; 
      background: #f9f9f9;
    }
    button { 
      padding: 10px 20px; 
      font-size: 16px; 
      background: #4CAF50; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🏆 AI Coach</h1>
  <p>Your personalized coaching tips based on mood trends.</p>
  <button onclick="getNewTip()">Get New Coaching Tip</button>
  <div id="coaching-tip">Click the button above for your first personalized tip!</div>

<script>
async function getNewTip() {
  try {
    const response = await fetch('https://mindfulwellness.onrender.com/api/ai-coach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id: 'user_' + localStorage.getItem('user_id') || 'default_user'
      })
    });

    if (!response.ok) throw new Error('API error');

    const data = await response.json();
    document.getElementById('coaching-tip').textContent = data.tip;

  } catch (error) {
    console.error(error);
    alert('❌ Could not load tip. Try again.');
  }
}
</script>
</body>
</html>
