<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Peer Matching</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label, select, input { display: block; margin-bottom: 10px; }
    #result { margin-top: 20px; display: none; border: 1px solid #ccc; padding: 10px; }
  </style>
</head>
<body>
  <h1>🤝 Peer Matching</h1>

  <label for="mood-level">Mood (1-10):</label>
  <input id="mood-level" type="number" min="1" max="10" value="7" />

  <label for="stress-level">Stress level:</label>
  <select id="stress-level">
    <option value="">Select stress level</option>
    <option value="low">Low</option>
    <option value="medium" selected>Medium</option>
    <option value="high">High</option>
  </select>

  <label for="concern">Concern:</label>
  <select id="concern">
    <option value="">Select concern</option>
    <option value="debt" selected>Debt</option>
    <option value="income">Income</option>
    <option value="savings">Savings</option>
    <option value="expenses">Expenses</option>
  </select>

  <button onclick="findPeer()">Find a peer</button>

  <div id="result">
    <h2>Meet your peer</h2>
    <p><b>Name:</b> <span id="peer-name"></span></p>
    <p><b>Mood:</b> <span id="peer-mood"></span></p>
    <p><b>Stress:</b> <span id="peer-stress"></span></p>
    <p><b>Concern:</b> <span id="peer-concern"></span></p>
  </div>

<script>
async function findPeer() {
  const moodLevel = document.getElementById('mood-level').value;
  const stressLevel = document.getElementById('stress-level').value;
  const concern = document.getElementById('concern').value;

  if (!stressLevel || !concern) {
    alert('⚠️ Please fill all fields');
    return;
  }

  try {
    const response = await fetch('https://mindfulwellness.onrender.com/api/peer-matching', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mood: parseInt(moodLevel),
        stress: stressLevel,
        concern: concern
      })
    });

    if (!response.ok) throw new Error('API error');

    const peer = await response.json();

    document.getElementById('peer-name').textContent = peer.name;
    document.getElementById('peer-mood').textContent = peer.mood;
    document.getElementById('peer-stress').textContent = peer.stress;
    document.getElementById('peer-concern').textContent = peer.concern;
    document.getElementById('result').style.display = 'block';

  } catch (error) {
    console.error(error);
    alert('❌ Could not find peer. Try again.');
  }
}
</script>
</body>
</html>
