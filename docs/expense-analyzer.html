<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Analyzer - MindfulWellness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        nav a {
            background: white;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        nav a:hover {
            transform: scale(1.05);
        }

        nav a.active {
            background: #667eea;
            color: white;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .card h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 20px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: scale(1.02);
        }

        .analysis {
            background: #f5f5f5;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
            font-size: 17px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="mood-tracker.html">🧠 Mood Tracker</a>
        <a href="thought-reframer.html">💡 Thought Reframing</a>
        <a href="expense-analyzer.html" class="active">💰 Expense Analyzer</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>💰 Expense Analyzer</h1>
            <p>Find hidden spending leaks and save money.</p>

            <textarea id="subscriptions" placeholder="Enter your subscriptions (e.g. Netflix $12, Gym $50, Spotify $10)"></textarea>

            <button onclick="analyzeExpenses()">🔍 Analyze My Spending</button>

            <div id="result" style="display: none;">
                <div class="analysis" id="analysisText"></div>
            </div>

            <div class="loading" id="loading" style="display: none;">⏳ AI is analyzing...</div>
        </div>
    </div>

    <script>
        const API_URL = "https://mindfulwellness.onrender.com";

        async function analyzeExpenses() {
            const subscriptions = document.getElementById('subscriptions').value;

            if (!subscriptions.trim()) {
                alert('Please enter your subscriptions');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/api/financial-leaks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subscriptions })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('analysisText').textContent = data.analysis;
                    document.getElementById('result').style.display = 'block';
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }

            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
