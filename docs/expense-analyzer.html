<!DOCTYPE html>
<html>
<head>
<title>💰 Expense Analyzer</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column}
nav {background:rgba(0,0,0,.2);padding:20px;display:flex;gap:10px;justify-content:center}
nav a {background:#fff;color:#667eea;padding:12px 24px;border-radius:25px;text-decoration:none;font-weight:600}
nav a.active {background:#667eea;color:#fff}
.container {flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card {background:#fff;border-radius:20px;padding:40px;max-width:500px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.2)}
h1 {font-size:28px;margin-bottom:20px;color:#333}
textarea {width:100%;padding:15px;font-size:16px;border:2px solid #ddd;border-radius:10px;min-height:140px;margin:15px 0}
button {width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer}
.analysis {background:#f0f8f0;padding:25px;border-radius:15px;margin-top:20px;font-size:18px;line-height:1.6}
.savings {font-size:28px;font-weight:700;color:#2b8a3e;margin:15px 0}
.loading {text-align:center;color:#667eea;font-size:18px;margin-top:20px}
</style>
</head>
<body>
<nav>
<a href="mood-tracker.html">🧠 Mood</a>
<a href="thought-reframer.html">💡 Thoughts</a>
<a href="expense-analyzer.html" class="active">💰 Money</a>
</nav>
<div class="container">
<div class="card">
<h1>💰 Find Money Leaks</h1>
<textarea id="subscriptions" placeholder="Netflix $12/mo
Gym $50/mo
Spotify $10/mo
Amazon Prime $15/mo
Add all your subscriptions..."></textarea>
<button onclick="analyze()">🔍 Analyze My Spending</button>
<div id="result" style="display:none">
<div class="analysis" id="analysis"></div>
</div>
<div class="loading" id="loading" style="display:none">🔍 AI scanning...</div>
</div>
</div>
<script>
const API = "https://mindfulwellness.onrender.com";
async function analyze() {
  const subs = document.getElementById('subscriptions').value;
  if (!subs.trim()) return alert('List your subscriptions');
  
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  
  try {
    const res = await fetch(`${API}/api/financial-leaks`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({subscriptions: subs})
    });
    const data = await res.json();
    document.getElementById('analysis').textContent = data.analysis;
    document.getElementById('result').style.display = 'block';
  } catch(e) {
    document.getElementById('analysis').textContent = 'Try again later';
    document.getElementById('result').style.display = 'block';
  }
  document.getElementById('loading').style.display = 'none';
}
</script>
</body>
</html>
