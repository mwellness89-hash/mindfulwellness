<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat Support</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat-window { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .message { margin: 5px 0; }
    .user { text-align: right; color: blue; }
    .bot { text-align: left; color: green; }
    .message-bubble { display: inline-block; padding: 8px 12px; border-radius: 15px; background: #eee; max-width: 70%; }
    .message.user .message-bubble { background: #a8dadc; }
    .message.bot .message-bubble { background: #f1faee; }
    .typing span { animation: blink 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>💬 Chat Support</h1>
  <div id="chat-window"></div>
  <input type="text" id="message-input" placeholder="Type your message..." style="width: 70%;" />
  <button onclick="sendMessage()">Send</button>

<script>
async function sendMessage() {
  const input = document.getElementById('message-input');
  const message = input.value.trim();
  if (!message) return;

  const chatWindow = document.getElementById('chat-window');
  const userMsg = document.createElement('div');
  userMsg.className = 'message user';
  userMsg.innerHTML = `<div class="message-bubble">${message}</div>`;
  chatWindow.appendChild(userMsg);

  input.value = '';

  const typingDiv = document.createElement('div');
  typingDiv.className = 'message bot';
  typingDiv.innerHTML = '<div class="typing"><span>.</span><span>.</span><span>.</span></div>';
  chatWindow.appendChild(typingDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  try {
    const response = await fetch('https://mindfulwellness.onrender.com/api/chat-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        conversation_id: 'conv_' + Date.now()
      })
    });

    if (!response.ok) throw new Error('API error');

    const data = await response.json();

    typingDiv.remove();

    const botMsg = document.createElement('div');
    botMsg.className = 'message bot';
    botMsg.innerHTML = `<div class="message-bubble">${data.reply}</div>`;
    chatWindow.appendChild(botMsg);
    chatWindow.scrollTop = chatWindow.scrollHeight;

  } catch (error) {
    console.error(error);
    typingDiv.remove();
    const errorMsg = document.createElement('div');
    errorMsg.className = 'message bot';
    errorMsg.innerHTML = '<div class="message-bubble">❌ Something went wrong. Try again.</div>';
    chatWindow.appendChild(errorMsg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }
}
</script>
</body>
</html>
