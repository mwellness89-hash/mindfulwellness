<!DOCTYPE html>
<html>
<head>
<title>MindfulWellness - Dashboard</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:40px}
h1 {text-align:center;font-size:48px;color:white;margin-bottom:40px;text-shadow:0 4px 8px rgba(0,0,0,0.3)}
.grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:30px;max-width:1200px;margin:0 auto}
.card {background:white;border-radius:24px;padding:40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);cursor:pointer;transition:all 0.3s;height:220px;display:flex;flex-direction:column;justify-content:center}
.card:hover {transform:translateY(-10px);box-shadow:0 30px 80px rgba(0,0,0,0.4)}
.card h2 {font-size:28px;margin-bottom:15px;color:#333}
.card p {font-size:18px;color:#666;line-height:1.6}
.mood {border-top:8px solid #667eea}
.thoughts {border-top:8px solid #51cf66}
.money {border-top:8px solid #ff6b6b}
@media(max-width:768px){.grid{grid-template-columns:1fr;padding:20px}.card{padding:30px;height:200px}}
</style>
</head>
<body>
<h1>🚀 MindfulWellness</h1>
<div class="grid">
  <a href="mood-tracker.html" class="card mood">
    <h2>🧠 Mood Tracker</h2>
    <p>Slide your mood (1-10). Share thoughts. Get AI coaching instantly.</p>
  </a>
  <a href="thought-reframer.html" class="card thoughts">
    <h2>💡 Thought Reframer</h2>
    <p>Share negative thoughts. Get 3 healthier alternatives with CBT.</p>
  </a>
  <a href="expense-analyzer.html" class="card money">
    <h2>💰 Money Leak Finder</h2>
    <p>List subscriptions. AI finds forgotten expenses. Save $50-200/mo.</p>
  </a>
</div>
</body>
</html>
