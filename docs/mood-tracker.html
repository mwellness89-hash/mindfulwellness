<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Tracker - MindfulWellness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        nav a {
            background: white;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        nav a:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        nav a.active {
            background: #667eea;
            color: white;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .card h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .conversation {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            min-height: 200px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.6;
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: 20px;
            text-align: right;
        }

        .message.ai {
            background: #e8e8e8;
            color: #333;
            margin-right: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            margin-bottom: 10px;
        }

        .mood-display {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="mood-tracker.html" class="active">🧠 Mood Tracker</a>
        <a href="thought-reframer.html">💡 Thought Reframing</a>
        <a href="expense-analyzer.html">💰 Expense Analyzer</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>🧠 Mood Tracker</h1>
            <p>How are you feeling today? Let's talk about it.</p>

            <div class="input-group">
                <label>Your Current Mood:</label>
                <input type="range" id="moodSlider" min="1" max="10" value="5">
                <div class="mood-display" id="moodDisplay">5/10</div>
            </div>

            <div class="input-group">
                <label>What's on your mind?</label>
                <textarea id="thought" placeholder="Share what you're feeling right now..."></textarea>
            </div>

            <button onclick="sendMessage()">💬 Share with AI Coach</button>

            <div class="conversation" id="conversation"></div>
            <div class="loading" id="loading" style="display: none;">⏳ AI is thinking...</div>
        </div>
    </div>

    <script>
        const API_URL = "https://mindfulwellness.onrender.com";
        let conversation = [];

        // Update mood display
        document.getElementById('moodSlider').addEventListener('input', (e) => {
            document.getElementById('moodDisplay').textContent = e.target.value + "/10";
        });

        async function sendMessage() {
            const mood = document.getElementById('moodSlider').value;
            const thought = document.getElementById('thought').value;

            if (!thought.trim()) {
                alert('Please share what you\'re thinking');
                return;
            }

            // Add user message to conversation
            addMessage('user', `Mood: ${mood}/10\n"${thought}"`);
            document.getElementById('thought').value = '';

            // Show loading
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/api/mood-checkin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mood: parseInt(mood), thought })
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage('ai', data.coaching_tip);
                    // Add follow-up prompt
                    addMessage('ai', 'How are you planning to address this today?');
                } else {
                    addMessage('ai', `Error: ${data.error || 'Something went wrong'}`);
                }
            } catch (error) {
                addMessage('ai', `Connection error: ${error.message}`);
            }

            document.getElementById('loading').style.display = 'none';
        }

        function addMessage(type, text) {
            const conversation = document.getElementById('conversation');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            conversation.appendChild(message);
            conversation.scrollTop = conversation.scrollHeight;
        }
    </script>
</body>
</html>
