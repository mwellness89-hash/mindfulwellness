<!DOCTYPE html><html><head><title>🧠 Mood</title><style>*{margin:0;padding:0}body{font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column}nav{padding:20px;display:flex;gap:10px;justify-content:center}nav a{background:#fff;color:#667eea;padding:12px 24px;border-radius:25px;text-decoration:none;font-weight:600}nav a.active{background:#667eea;color:#fff}.container{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}.card{background:#fff;border-radius:20px;padding:40px;max-width:500px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.2)}h1{font-size:28px;margin-bottom:20px}textarea{width:100%;padding:15px;border:2px solid #ddd;border-radius:10px;min-height:100px;margin:15px 0}button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer}</style></head><body><nav><a href="mood-tracker.html" class="active">🧠 Mood</a><a href="thought-reframer.html">💡 Thoughts</a><a href="expense-analyzer.html">💰 Money</a></nav><div class="container"><div class="card"><h1>🧠 Mood Check</h1><input type="range" id="mood" min="1" max="10" value="5"><div style="text-align:center;font-size:48px;color:#667eea" id="moodNum">5/10</div><textarea id="thought" placeholder="What's stressing you?"></textarea><button onclick="send()">Talk to AI</button><div id="chat"></div></div></div><script>document.getElementById('mood').oninput=e=>document.getElementById('moodNum').textContent=e.target.value+'/10';async function send(){const m=document.getElementById('mood').value,t=document.getElementById('thought').value;document.getElementById('chat').innerHTML+='<div style="background:#667eea;color:white;padding:10px;margin:10px 0">'+`Mood: ${m}/10 "${t}"`+'</div>';fetch('https://mindfulwellness.onrender.com/api/mood-checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mood:parseInt(m),thought:t})}).then(r=>r.json()).then(d=>document.getElementById('chat').innerHTML+='<div style="background:#e8f0fe;padding:10px;margin:10px 0">'+d.coaching_tip+'</div>')}</script></body></html>
