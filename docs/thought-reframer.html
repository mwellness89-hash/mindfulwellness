<!DOCTYPE html><html><head><title>💡 Thoughts</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column}nav{background:rgba(0,0,0,.2);padding:20px;display:flex;gap:10px;justify-content:center}nav a{background:#fff;color:#667eea;padding:12px 24px;border-radius:25px;text-decoration:none;font-weight:600}nav a.active{background:#667eea;color:#fff}.container{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}.card{background:#fff;border-radius:20px;padding:40px;max-width:500px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.2)}h1{font-size:28px;margin-bottom:20px;color:#333}textarea{width:100%;padding:15px;font-size:16px;border:2px solid #ddd;border-radius:10px;min-height:120px;margin:15px 0}button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer}.thought-box{background:#ffe0e0;border-left:5px solid #ff6b6b;padding:20px;border-radius:10px;margin:20px 0;font-size:18px}.reframe{background:#e0f5e0;border-left:5px solid #51cf66;padding:20px;border-radius:10px;margin:10px 0;font-size:18px}</style></head><body><nav><a href="mood-tracker.html">🧠 Mood</a><a href="thought-reframer.html" class="active">💡 Thoughts</a><a href="expense-analyzer.html">💰 Money</a></nav><div class="container"><div class="card"><h1>💡 Reframe Thoughts</h1><textarea id="thought" placeholder="I'll never get out of debt..."></textarea><button onclick="reframe()">✨ Get Alternatives</button><div id="result" style="display:none"><div class="thought-box" id="original"></div><div id="reframes"></div></div></div></div><script>const API="https://mindfulwellness.onrender.com";async function reframe(){const t=document.getElementById('thought').value;document.getElementById('original').textContent=`❌ "${t}"`;document.getElementById('result').style.display='block';fetch(`${API}/api/thought-reframe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thought:t})}).then(r=>r.json()).then(d=>{d.reframes.forEach((r,i)=>{const div=document.createElement('div');div.className='reframe';div.innerHTML=`✅ ${i+1}: ${r}`;document.getElementById('reframes').appendChild(div)})});}</script></body></html>
